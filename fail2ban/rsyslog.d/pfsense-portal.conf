# Reçoit les logs pfSense (UDP 514) et isole le portail captif.
#
#   sudo cp fail2ban/rsyslog.d/pfsense-portal.conf /etc/rsyslog.d/30-pfsense-portal.conf
#   sudo mkdir -p /var/log/pfsense
#   sudo touch /var/log/pfsense/portal.log
#   sudo systemctl restart rsyslog
#
# Sur pfSense : Status → System Logs → Settings
#   Enable Remote Logging
#   Source : LAN (ou l'interface vers Debian)
#   IP : IP du Debian (souvent 192.168.0.99)
#   Port : 514 UDP
#   Everything (ou au minimum Portal Auth / System)

module(load="imudp")
input(type="imudp" port="514")

if ($fromhost-ip == '192.168.0.1') and (
    $msg contains 'captiveportal'
    or $msg contains 'Captive Portal'
    or $msg contains 'logportalauth'
    or $msg contains 'portalauth'
) then {
    action(type="omfile" file="/var/log/pfsense/portal.log")
    stop
}
