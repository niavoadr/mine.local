# Filtre Fail2ban pour le portail de connexion mine.local (login.php).
#
# Installation :
#   sudo cp /usr/src/app/portail/admin/mine.local/fail2ban/filter.d/mine-login.conf /etc/fail2ban/filter.d/
#
# Ligne produite par login.php :
#   2026-08-12 14:30:00 [FAIL2BAN] Failed login from 192.168.1.50 user=admin

[INCLUDES]
before = common.conf

[Definition]
failregex = ^\[FAIL2BAN\] Failed login from <HOST> user=
            ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} \[FAIL2BAN\] Failed login from <HOST> user=

ignoreregex =

[Init]
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
