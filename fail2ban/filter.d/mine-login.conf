# Filtre Fail2ban pour login.php
#
# Ligne produite :
#   2026-08-13 06:50:39 [FAIL2BAN] Failed login from 192.168.0.5 user=admin
#
# datepattern retire la date ; il reste " [FAIL2BAN] ..." (espace en tête).

[INCLUDES]
before = common.conf

[Definition]
failregex = \[FAIL2BAN\] Failed login from <HOST> user=

ignoreregex =

[Init]
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
