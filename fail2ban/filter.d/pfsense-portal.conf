# Échecs de connexion du portail captif pfSense (zone debian).
#
# Formats courants (syslog / portalauth.log) :
#   logportalauth: debian,bob,aa:bb:cc:dd:ee:ff,192.168.0.50,FAILURE,invalid
#   Captive Portal login failed for user 'bob' from 192.168.0.50
#   captiveportal: Zone: debian - FAILURE: user 'bob', IP 192.168.0.50

[INCLUDES]
before = common.conf

[Definition]
failregex = ^.*logportalauth:\s*\S+,\S+,\S+,<HOST>,FAILURE
            ^.*[Cc]aptive [Pp]ortal.*(?:login |authentication )?failed.*<HOST>
            ^.*authentication failed.*(?:from |IP )<HOST>
            ^.*FAILURE:.*IP <HOST>
            ^.*captiveportal.*FAILURE.*<HOST>

ignoreregex =
