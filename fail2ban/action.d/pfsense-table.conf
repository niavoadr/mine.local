# Ajoute / retire l'IP de la table pf `fail2ban` sur pfSense.
# Sans cette table + règle Block, le portail :8002 reste accessible.
#
# Clé : la même que Snort, exportée une fois dans un fichier (pas dans le .env).
#   sudo mkdir -p /etc/fail2ban/ssh
#   sudo nano /etc/fail2ban/ssh/pfsense_key    # coller PFSENSE_SSH_KEY
#   sudo chmod 600 /etc/fail2ban/ssh/pfsense_key

[Definition]
actionstart =
actionstop =
actioncheck =
actionban   = /usr/bin/ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=8 -p <port> -i <key> <user>@<host> "pfctl -t fail2ban -T add <ip>"
actionunban = /usr/bin/ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=8 -p <port> -i <key> <user>@<host> "pfctl -t fail2ban -T delete <ip>"

[Init]
host = 192.168.0.1
port = 22
user = admin
key  = /etc/fail2ban/ssh/pfsense_key
