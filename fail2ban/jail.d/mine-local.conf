# Jail Fail2ban pour le portail de connexion mine.local.
#
# Installation :
#   1. Ajuster `logpath` ci-dessous vers le chemin ABSOLU de logs/auth.log
#   2. sudo cp fail2ban/jail.d/mine-local.conf /etc/fail2ban/jail.d/mine-local.conf
#   3. sudo fail2ban-client reload
#   4. sudo fail2ban-client status mine-login
#
# Ce fichier n'active que la jail du portail web.
# La jail sshd standard de Fail2ban peut rester gérée dans jail.local :
# les bans sshd seront quand même visibles dans le dashboard
# (fail2ban_sync.php lit tout /var/log/fail2ban.log).

[mine-login]
enabled  = true
port     = http,https
filter   = mine-login
logpath  = /var/www/html/logs/auth.log
backend  = auto
maxretry = 5
findtime = 600
bantime  = 3600
