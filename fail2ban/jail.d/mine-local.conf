# Jail Fail2ban pour le portail login.php
#
#   sudo cp fail2ban/filter.d/mine-login.conf /etc/fail2ban/filter.d/
#   sudo cp fail2ban/jail.d/mine-local.conf   /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#   sudo fail2ban-client status mine-login
#
# logpath = chemin réel du projet (pas le symlink /var/www/mine.local).

[mine-login]
enabled  = true
port     = http,https
filter   = mine-login
logpath  = /usr/src/app/portail/admin/mine.local/logs/auth.log
backend  = auto
maxretry = 5
findtime = 600
bantime  = 3600
