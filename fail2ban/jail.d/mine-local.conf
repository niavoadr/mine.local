# Jail Fail2ban — portail admin
#
#   http://portail.cpanel/login.php  → mine-login
#   http://192.168.0.99/login.php    → mine-login (même login.php / auth.log)
#
#   sudo cp fail2ban/filter.d/mine-login.conf /etc/fail2ban/filter.d/
#   sudo cp fail2ban/jail.d/mine-local.conf   /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload

[DEFAULT]
ignoreip = 127.0.0.1/8 ::1
bantime  = 3600
findtime = 600
maxretry = 5

[mine-login]
enabled  = true
port     = http,https
filter   = mine-login
logpath  = /usr/src/app/portail/admin/mine.local/logs/auth.log
backend  = auto
