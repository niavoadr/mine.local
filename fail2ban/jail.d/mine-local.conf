# Jails Fail2ban — 3 URLs protégées
#
#   http://portail.cpanel/login.php          → mine-login (même login.php)
#   http://192.168.0.99/login.php            → mine-login (même login.php)
#   http://192.168.0.1:8002/index.php?zone=debian → pfsense-portal
#
#   sudo cp fail2ban/filter.d/*.conf /etc/fail2ban/filter.d/
#   sudo cp fail2ban/action.d/*.conf /etc/fail2ban/action.d/
#   sudo cp fail2ban/jail.d/mine-local.conf /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload

[DEFAULT]
ignoreip = 127.0.0.1/8 ::1 192.168.0.1
bantime  = 3600
findtime = 600
maxretry = 5

# Portail admin (hostname + IP Debian = un seul fichier auth.log)
[mine-login]
enabled  = true
port     = http,https
filter   = mine-login
logpath  = /usr/src/app/portail/admin/mine.local/logs/auth.log
backend  = auto

# Portail captif pfSense (zone debian, port 8002)
# Les logs doivent arriver sur Debian via syslog (voir rsyslog.d/).
# L'action pfsense-table coupe l'IP sur pfSense (sinon le :8002 reste joignable).
[pfsense-portal]
enabled  = true
port     = 8002
filter   = pfsense-portal
logpath  = /var/log/pfsense/portal.log
backend  = auto
action   = iptables-multiport[name=pfsense-portal, port="8002,http,https"]
           pfsense-table
