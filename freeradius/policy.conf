# =============================================================================
# Politique FreeRADIUS — Liste noire + Visiteur 1 identifiant = 1 appareil
# =============================================================================
#
# Ce fichier définit deux politiques appelées depuis le virtual server
# (sites-available/default) :
#
#   1. blacklist_check   — rejette toute connexion dont la MAC est en liste noire
#   2. visitor_one_device — empêche un identifiant visiteur d'être utilisé
#                          par un deuxième appareil
#
# PRINCIPE :
#   - Liste noire : on interroge radcheck pour Auth-Type=Reject correspondant
#     à la MAC de l'appareil (Calling-Station-Id). Si trouvé → reject.
#   - Visiteur : on interroge radacct pour voir si le username visiteur a déjà
#     une session réussie avec une autre MAC. Si oui → reject.
#     Les tentatives échouées (MAC blacklistée, mauvais mot de passe…) ne
#     créent PAS d'entrée dans radacct, donc l'identifiant reste disponible.
#
# INSTALLATION :
#   1. Copier ce fichier dans /etc/freeradius/3.0/policy.d/ (Debian/Ubuntu)
#      ou /etc/raddb/policy.d/ (CentOS/RHEL)
#   2. Modifier sites-available/default (voir sites-default-patch.conf)
#   3. Relancer FreeRADIUS : systemctl restart freeradius
# =============================================================================

blacklist_check {
    # Ne rien faire si Calling-Station-Id est absent (NAS ne l'envoie pas)
    if (!&Calling-Station-Id) {
        ok
        return
    }

    # Chercher dans radcheck si la MAC de l'appareil a Auth-Type = Reject
    # On normalise les MAC via regexp_replace pour ignorer la casse et le format
    # (AA-BB-CC-DD-EE-FF vs aa:bb:cc:dd:ee:ff, etc.)
    #
    # Si la requête retourne "1" → la MAC est bloquée → reject
    if ("%{sql:SELECT 1 FROM radcheck WHERE attribute = 'Auth-Type' AND value = 'Reject' AND regexp_replace(lower(username), '[^0-9a-f]', '', 'g') = regexp_replace(lower('%{Calling-Station-Id}'), '[^0-9a-f]', '', 'g') LIMIT 1}") {
        reject
    }
}

visitor_one_device {
    # Ne s'applique qu'aux visiteurs (username n'est PAS une adresse MAC)
    # Les adresses MAC correspondent au motif : xx:xx:xx:xx:xx:xx (ou variantes)
    if (&User-Name =~ /^([0-9a-f]{2}[:.\-]?){5}[0-9a-f]{2}$/i) {
        # C'est une MAC (MAB) → pas un visiteur, on passe
        ok
        return
    }

    # C'est un visiteur → vérifier si son identifiant a déjà été utilisé
    # par un AUTRE appareil (session réussie dans radacct)
    #
    # radacct n'enregistre que les sessions ayant réussi l'authentification.
    # Une tentative échouée (MAC blacklistée, mauvais mot de passe…)
    # n'apparaît pas dans radacct → l'identifiant reste réutilisable.
    if ("%{sql:SELECT 1 FROM radacct WHERE username = '%{User-Name}' AND AcctStartTime IS NOT NULL AND regexp_replace(lower(CallingStationId), '[^0-9a-f]', '', 'g') != regexp_replace(lower('%{Calling-Station-Id}'), '[^0-9a-f]', '', 'g') LIMIT 1}") {
        reject
    }
}
