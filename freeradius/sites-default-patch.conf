# =============================================================================
# Patch à appliquer dans sites-available/default
# =============================================================================
#
# Deux modifications à faire dans le virtual server par défaut :
#   1. Ajouter blacklist_check AVANT le module sql dans authorize
#   2. Ajouter visitor_one_device APRÈS le module sql dans authorize
#
# Voir ci-dessous le diff.
# =============================================================================


# --- Dans la section authorize ---

# AVANT (configuration par défaut) :
#
# authorize {
#     preprocess
#     ...
#     sql
#     ...
# }
#
# APRÈS (avec les deux politiques) :
#
# authorize {
#     preprocess
#     ...
#
#     # 1. Vérifier si la MAC est dans la liste noire → reject
#     blacklist_check
#
#     # Autorisation SQL normale (radcheck, radgroupcheck, etc.)
#     sql
#
#     # 2. Vérifier si un visiteur est déjà utilisé par un autre appareil → reject
#     visitor_one_device
#
#     ...
# }


# --- Section complète authorize (exemple) ---
#
# authorize {
#     preprocess
#     auth_log
#
#     # Vérification liste noire : MAC bloquée → reject immédiatement
#     blacklist_check
#
#     # Autorisation SQL standard (Cleartext-Password, Auth-Type, etc.)
#     sql
#
#     # Vérification visiteur : 1 identifiant = 1 appareil
#     visitor_one_device
#
#     expiration
#     logintime
#     pap
# }
